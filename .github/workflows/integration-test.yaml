  # ── HF Cache: read-only mount, env, and offline model load ──────────
  test-hf-cache-mount:
    runs-on: { group: "meta-prod-aws-ue1", labels: ["c-mt-l-x86iamx-8-32"] }
    container:
      image: python:3.12-slim
    steps:
      - name: Verify /mnt/hf_cache is mounted
        run: |
          echo "=== HF Cache Mount ==="
          if [ ! -d /mnt/hf_cache ]; then
            echo "FAIL: /mnt/hf_cache does not exist"
            exit 1
          fi
          if ! grep -q ' /mnt/hf_cache ' /proc/mounts; then
            echo "FAIL: /mnt/hf_cache is not a mountpoint"
            grep hf_cache /proc/mounts || true
            exit 1
          fi
          ls -la /mnt/hf_cache || true
          echo "PASS: /mnt/hf_cache is mounted"

      - name: Verify HF cache env vars
        run: |
          echo "=== HF Cache Env ==="
          FAIL=0
          [ "$HF_HOME" = "/mnt/hf_cache" ] || { echo "FAIL: HF_HOME='$HF_HOME'"; FAIL=1; }
          EXPECTED_BUCKET="pytorch-hf-model-cache-meta-staging-aws-ue1"
          [ "$HF_CACHE_S3_BUCKET" = "$EXPECTED_BUCKET" ] \
            || { echo "FAIL: HF_CACHE_S3_BUCKET='$HF_CACHE_S3_BUCKET' (expected $EXPECTED_BUCKET)"; FAIL=1; }
          [ -n "$HF_CACHE_S3_REGION" ] || { echo "FAIL: HF_CACHE_S3_REGION is empty"; FAIL=1; }
          echo "HF_HOME=$HF_HOME"
          echo "HF_CACHE_S3_BUCKET=$HF_CACHE_S3_BUCKET HF_CACHE_S3_REGION=$HF_CACHE_S3_REGION"
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "PASS: HF cache env vars are correct"

      - name: Verify mount is read-only
        run: |
          echo "=== Read-only Enforcement ==="
          if touch /mnt/hf_cache/.integration-write-probe 2>/dev/null; then
            echo "FAIL: wrote to /mnt/hf_cache — the cache mount must be read-only for job pods"
            rm -f /mnt/hf_cache/.integration-write-probe 2>/dev/null || true
            exit 1
          fi
          echo "PASS: /mnt/hf_cache rejected a write (read-only)"

  # Read path mirroring a real CI job: HF_HOME=/mnt/hf_cache + offline flags, load
  # a small model. Fails if the cache isn't populated.
  test-hf-cache-offline-read:
    runs-on: { group: "meta-prod-aws-ue1", labels: ["c-mt-l-x86iamx-8-32"] }
    container:
      image: python:3.12-slim
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Load a small model offline from /mnt/hf_cache
        run: |
          echo "=== Offline Read (mirrors normal CI jobs) ==="
          MODEL="prajjwal1/bert-tiny"
          CACHE_DIR="/mnt/hf_cache/hub/models--$(echo "$MODEL" | sed 's|/|--|g')"
          if [ ! -d "$CACHE_DIR" ]; then
            echo "FAIL: $MODEL not in the cache ($CACHE_DIR missing) — the cache must be populated first"
            exit 1
          fi
          pip install --no-cache-dir 'huggingface_hub>=0.24'
          MODEL="$MODEL" python3 -c "
          import os, sys
          from huggingface_hub import snapshot_download
          model = os.environ['MODEL']
          path = snapshot_download(model, local_files_only=True)
          files = os.listdir(path)
          if not files:
              print('FAIL: empty snapshot at', path)
              sys.exit(1)
          print('PASS: loaded', model, 'offline from', path, '(' + str(len(files)) + ' files)')
          "

  # Runs on an L4 (g6) runner. g6 is region-restricted (e.g. excluded in
  # us-west-1); where it's unavailable this block is stripped so the job doesn't
  # queue forever for a runner that can't come online. See REGION_GATED_BLOCKS
  # in integration-tests/scripts/python/phases.py.
  # Load Qwen2.5-7B from the cache and generate — the real "use the model" path
  # (loading reads the weights through the mount). Seed once with
  # `scripts/hf-cache-seed.py <cluster> Qwen/Qwen2.5-7B-Instruct`.
  test-hf-cache-large-read:
    # GPU: CPU loading keeps weights mmap'd from the FUSE, so generate() SIGBUSes
    # faulting them (repro'd on 32/64GB, even low_cpu_mem_usage=False). On GPU
    # weights go to VRAM, so generate never touches the FUSE. A single L4 (24GB)
    # fits 7B bf16 — far cheaper than an A100/p4d node for a 1-GPU test.
    runs-on: { group: "meta-prod-aws-ue1", labels: ["c-mt-l-x86aavx2-29-113-l4"] }
    container:
      image: python:3.12-slim
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MODEL: "Qwen/Qwen2.5-7B-Instruct"
      # Generous cap: a cold GPU node fetches ~15GB from S3 (~430s observed). Still
      # catches the pathological case (re-downloading / pulling beyond this model).
      MAX_LOAD_SECONDS: "900"
    steps:
      - name: Load the model offline from /mnt/hf_cache and run inference
        run: |
          echo "=== Large-model offline inference ==="
          CACHE_DIR="/mnt/hf_cache/hub/models--$(echo "$MODEL" | sed 's|/|--|g')"
          if [ ! -d "$CACHE_DIR" ]; then
            echo "FAIL: $MODEL not in the cache ($CACHE_DIR missing) — seed it with scripts/hf-cache-seed.py"
            exit 1
          fi
          pip install --no-cache-dir torch==2.12.1  # default CUDA build for the GPU runner
          pip install --no-cache-dir 'transformers>=4.45' 'huggingface_hub>=0.24' accelerate
          # device_map='cuda' loads weights to VRAM (see runs-on note); greedy decode.
          MODEL="$MODEL" python3 -c "
          import os, sys, time
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer
          assert torch.cuda.is_available(), 'CUDA not available on this runner'
          mid = os.environ['MODEL']
          max_load = float(os.environ.get('MAX_LOAD_SECONDS', '300'))
          t0 = time.time()
          tok = AutoTokenizer.from_pretrained(mid)
          model = AutoModelForCausalLM.from_pretrained(mid, torch_dtype=torch.bfloat16, device_map='cuda')
          model.eval()
          load_s = time.time() - t0
          print('loaded', mid, 'on', torch.cuda.get_device_name(0), 'in', round(load_s), 's (limit', round(max_load), 's)', flush=True)
          if load_s > max_load:
              print('FAIL: load took', round(load_s), 's >', round(max_load), 's — cache not serving efficiently (re-downloading from S3?)')
              sys.exit(1)
          prompt = 'In one sentence, what is PyTorch?'
          inputs = tok.apply_chat_template([{'role': 'user', 'content': prompt}], add_generation_prompt=True, return_tensors='pt', return_dict=True).to('cuda')
          input_len = inputs['input_ids'].shape[1]
          t1 = time.time()
          with torch.no_grad():
              out = model.generate(**inputs, max_new_tokens=16, do_sample=False)
          reply = tok.decode(out[0][input_len:], skip_special_tokens=True).strip()
          print('generated in', round(time.time() - t1), 's', flush=True)
          print('PROMPT:', prompt)
          print('OUTPUT:', reply)
          if not reply:
              print('FAIL: model loaded but produced no output'); sys.exit(1)
          print('PASS:', mid, 'ran offline inference from the shared cache')
          "

  # ── HF Cache: refresh (online download → sync to S3) ─────────────────
  # Mirrors ci-refresh-hf-cache: assume the OIDC writer role, download a model
  # online, then aws s3 sync to the bucket. Hard-fails if the role can't be assumed
  # (missing hf-cache-write env/trust) — must be fixed, not silently skipped.
  test-hf-cache-refresh-sync:
    runs-on: { group: "meta-prod-aws-ue1", labels: ["c-mt-l-x86iamx-8-32"] }
    environment: hf-cache-write
    permissions:
      id-token: write
      contents: read
    container:
      image: python:3.12-slim
    steps:
      - name: Install huggingface_hub + awscli
        run: pip install --no-cache-dir 'huggingface_hub>=0.24' awscli

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::308535385114:role/gha_workflow_hf-cache-write
          # STS/default region only — the S3 ops below pass --region
          # "$HF_CACHE_S3_REGION" (the per-cluster bucket region) explicitly.
          aws-region: us-east-1

      - name: Download from HF Hub (online) then sync to S3
        env:
          # HF_HOME=/mnt/hf_cache is read-only, but hf-xet writes cache/logs under
          # $HF_HOME — point it at writable scratch (refresh writes to S3, not the mount).
          HF_HOME: ${{ runner.temp }}/hf-refresh
        run: |
          echo "=== Refresh: online download + sync to S3 ==="
          MODEL="prajjwal1/bert-tiny"
          mkdir -p "$HF_HOME/hub"
          # Online download into the writable HF_HOME (NOT the read-only mount).
          MODEL="$MODEL" python3 -c "
          import os
          from huggingface_hub import snapshot_download
          p = snapshot_download(os.environ['MODEL'], cache_dir=os.path.join(os.environ['HF_HOME'], 'hub'))
          print('downloaded', os.environ['MODEL'], 'to', p)
          "
          # Publish like the refresh job; aws s3 sync follows symlinks -> symlink-free in S3.
          aws s3 sync "$HF_HOME/hub" "s3://$HF_CACHE_S3_BUCKET/hub" --region "$HF_CACHE_S3_REGION" --no-progress
          PREFIX="hub/models--$(echo "$MODEL" | sed 's|/|--|g')/"
          COUNT=$(aws s3 ls "s3://$HF_CACHE_S3_BUCKET/$PREFIX" --region "$HF_CACHE_S3_REGION" --recursive | wc -l | tr -d ' ')
          echo "Synced objects under $PREFIX: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: nothing synced for $MODEL"
            exit 1
          fi
          echo "PASS: downloaded $MODEL from HF Hub and synced $COUNT objects to s3://$HF_CACHE_S3_BUCKET/$PREFIX"

  # Concurrent writers must not corrupt the bucket: a scheduled refresh can overlap
  # with a manual seed (scripts/hf-cache-seed.py) or another refresh. Run N parallel
  # `aws s3 sync` of the same model to a per-run prefix and assert all succeed and the
  # result converges to a complete, consistent object set (no object lost to a race).
  test-hf-cache-concurrent-sync:
    runs-on: { group: "meta-prod-aws-ue1", labels: ["c-mt-l-x86iamx-8-32"] }
    environment: hf-cache-write
    permissions:
      id-token: write
      contents: read
    container:
      image: python:3.12-slim
    steps:
      - name: Install deps (torch, transformers, hub, awscli)
        run: |
          pip install --no-cache-dir torch==2.12.1  # default build; runs on CPU for a tiny model
          # transformers <5: bert-tiny's config.json has no model_type key (5.x rejects
          # it; 4.x infers "bert"). hf_hub <1 stays compatible with transformers 4.x.
          pip install --no-cache-dir 'transformers>=4.45,<5' 'huggingface_hub>=0.24,<1' awscli

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::308535385114:role/gha_workflow_hf-cache-write
          aws-region: us-east-1

      - name: Parallel sync, then assert the uploaded model is complete & usable
        env:
          HF_HOME: ${{ runner.temp }}/hf-concurrent
        run: |
          set -eu
          echo "=== Concurrent upload conflict test ==="
          MODEL="prajjwal1/bert-tiny"
          SRC="$HF_HOME/hub"
          VERIFY="$HF_HOME/verify"
          mkdir -p "$SRC"
          MODEL="$MODEL" python3 -c "
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(os.environ['MODEL'], cache_dir=os.path.join(os.environ['HF_HOME'], 'hub'))
          "
          # Per-run prefix under hub/ (the scope the refresh role writes) so overlapping
          # CI runs never collide; removed on exit.
          DEST="s3://$HF_CACHE_S3_BUCKET/hub/zz_concurrent_test/${{ github.run_id }}-${{ github.run_attempt }}"
          cleanup() { aws s3 rm "$DEST" --region "$HF_CACHE_S3_REGION" --recursive --only-show-errors || true; }
          trap cleanup EXIT

          # 1) N writers of identical content at the same destination, concurrently.
          N=3
          pids=""
          for _ in $(seq 1 "$N"); do
            aws s3 sync "$SRC" "$DEST" --region "$HF_CACHE_S3_REGION" --no-progress &
            pids="$pids $!"
          done
          rc=0
          for pid in $pids; do
            wait "$pid" || rc=1
          done
          [ "$rc" -eq 0 ] || { echo "FAIL: a concurrent sync exited non-zero"; exit 1; }

          # 2) Complete: a reconciling sync must find nothing left to upload.
          LEFT=$(aws s3 sync "$SRC" "$DEST" --region "$HF_CACHE_S3_REGION" --no-progress --dryrun | grep -c 'upload:' || true)
          [ "$LEFT" -eq 0 ] || { echo "FAIL: $LEFT objects missing after $N concurrent syncs (lost to a race)"; exit 1; }

          # 3) Uncorrupted & usable: pull the uploaded copy back, load it, run a forward
          #    pass, and assert it matches the freshly-downloaded source bit-for-bit.
          aws s3 sync "$DEST" "$VERIFY" --region "$HF_CACHE_S3_REGION" --no-progress
          MODEL="$MODEL" SRC="$SRC" VERIFY="$VERIFY" python3 -c "
          import glob, os, torch
          from transformers import AutoModel
          slug = 'models--' + os.environ['MODEL'].replace('/', '--')
          def load(cache):
              # Load from the snapshot dir directly — avoids from_pretrained's
              # cache_dir/repo-id resolution, which differs across transformers majors.
              snap = sorted(glob.glob(os.path.join(cache, slug, 'snapshots', '*')))[0]
              return AutoModel.from_pretrained(snap, local_files_only=True).eval()
          src = load(os.environ['SRC'])
          got = load(os.environ['VERIFY'])
          # Fixed input_ids — no tokenizer (bert-tiny ships only vocab.txt; the fast
          # tokenizer needs sentencepiece). We verify weight fidelity, not tokenization.
          ids = torch.tensor([[101, 7592, 2088, 102]])
          with torch.no_grad():
              ref = src(ids).last_hidden_state
              out = got(ids).last_hidden_state
          assert torch.isfinite(out).all(), 'round-tripped model produced non-finite output'
          assert torch.allclose(ref, out, atol=1e-6), 'round-tripped output differs from source — corruption'
          print('loaded + forward OK; output', tuple(out.shape), 'matches source')
          "
          echo "PASS: $N concurrent syncs converged to a complete, uncorrupted, usable model"


  # ── GPU Runner Tests ──────────────────────────────────────────────────
  test-gpu-t4:
    runs-on: { group: "meta-prod-aws-ue1", labels: ["c-mt-l-x86iavx512-29-115-t4"] }
    container:
